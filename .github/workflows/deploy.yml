name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check Supabase configuration
        run: |
          missing=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL is empty."; missing=1
          else
            echo "VITE_SUPABASE_URL is set (${#VITE_SUPABASE_URL} characters)."
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY is empty."; missing=1
          else
            echo "VITE_SUPABASE_PUBLISHABLE_KEY is set (${#VITE_SUPABASE_PUBLISHABLE_KEY} characters)."
          fi
          if [ "$missing" = "1" ]; then
            echo "Add them under Settings > Secrets and variables > Actions > Variables."
            echo "Without them the site builds but loads no plans."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v5
